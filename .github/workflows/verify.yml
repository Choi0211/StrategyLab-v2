name: PR Fast Verify

# ci/optimize-pr-verification: PR-blocking critical path only. Real job
# duration measurements (see PR body) showed Ubuntu 3.11/3.12 complete in
# ~5-6 minutes each while Windows 3.11 alone routinely took 30-45 minutes -
# the single dominant bottleneck for PR feedback time, since fail-fast:
# false already runs every combo in parallel and the overall run duration
# is bounded by the slowest job.
#
# Windows 3.11 compatibility coverage is NOT removed - see
# verify-compatibility.yml, which runs the full 4-combo matrix (including
# Windows 3.11) on every push to main/develop-v2, on a weekly schedule, and
# on demand. This file keeps Windows coverage in the PR-blocking path via
# 3.12 (the newer, still-supported interpreter) so a genuine Windows
# regression is still caught before merge, just not gated on the one
# consistently slow combination.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-fast-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  gaon-tailscale-connectivity:
    name: Approved Tailscale SSH connectivity probe (no deployment)
    if: github.event.pull_request.number == 257 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: gaon-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Connect ephemeral Tailscale runner
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:gaon-deploy
          ping: 100.99.127.60
      - name: Verify TCP/22 and pinned SSH host identity without logging in
        env:
          DEPLOY_HOST: ${{ vars.GAON_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.GAON_DEPLOY_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.GAON_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "100.99.127.60"
          test "$DEPLOY_PORT" = "22"
          test -n "$KNOWN_HOSTS"
          observed=$(mktemp)
          expected=$(mktemp)
          trap 'rm -f "$observed" "$expected"' EXIT
          ssh-keyscan -T 15 -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" 2>/dev/null > "$observed"
          printf '%s\\n' "$KNOWN_HOSTS" | awk '$2 == "ssh-ed25519" {print}' > "$expected"
          test -s "$observed"
          test -s "$expected"
          diff -u "$expected" "$observed" >/dev/null
          echo "PASS: Tailscale SSH endpoint and pinned host key match. No SSH login or deployment performed."

  workflow-contract:
    name: Deployment workflow syntax and expressions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash scripts/check_workflows.sh

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e .

      - name: Verify release
        run: python scripts/verify_release.py --report-json report/ci.json

      - name: Publish structured CI report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gaon-pr-ci-${{ matrix.os }}-${{ matrix.python-version }}
          path: report/ci.json
          if-no-files-found: error
