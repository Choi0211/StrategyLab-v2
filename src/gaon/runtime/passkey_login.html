<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가온 관리자 로그인</title><style>body{font:16px system-ui;background:#10151e;color:#edf3fc;max-width:520px;margin:8vh auto;padding:20px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:9px;border:1px solid #59697e}input{background:#202c3b;color:white}button{background:#7b9ff5;color:#081120;font-weight:700}pre{white-space:pre-wrap}</style></head><body><h1>가온 관리자 로그인</h1><label>관리자 식별자<input id="actor" value="owner" autocomplete="username"></label><button id="login">패스키로 로그인</button><p id="login-state" role="status" aria-live="polite">로그인 전</p><button id="logout" disabled>로그아웃</button><h2>전략 버전 승인</h2><p>승격 또는 롤백은 별도의 패스키 재인증이 필요합니다. 대상 버전과 작업을 반드시 확인하세요.</p><h3>연구 후보 (조회 전용)</h3><p>연구 결과는 검증과 승격 준비가 완료되기 전까지 승인할 수 없습니다.</p><div id="research-list" role="status">로그인 후 표시됩니다.</div><label>전략 선택<select id="family"><option value="">로그인 후 불러오기</option></select></label><label>버전 선택<select id="version"><option value="">전략을 먼저 선택하세요</option></select></label><button id="refresh" disabled>전략 목록 새로고침</button><label>작업<select id="action"><option value="activate">승격</option><option value="rollback">롤백</option></select></label><button id="approve" disabled>패스키로 전략 승인</button><pre id="status" role="status"></pre><script>
const el=id=>document.getElementById(id),dec=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0)),enc=x=>{let s='';for(const b of new Uint8Array(x))s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};let csrf='';
el('login').onclick=async()=>{try{el('status').textContent='인증 요청 중...';el('login-state').textContent='지문 인증 대기 중...';const actor=el('actor').value;const b=await fetch('/gaon/admin/passkey/login/begin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor})});if(!b.ok)throw Error('로그인 시작 실패 (HTTP '+b.status+')');const opts=await b.json();opts.challenge=dec(opts.challenge);for(const c of opts.allowCredentials||[])c.id=dec(c.id);const c=await navigator.credentials.get({publicKey:opts});const credential={id:c.id,rawId:enc(c.rawId),type:c.type,response:{clientDataJSON:enc(c.response.clientDataJSON),authenticatorData:enc(c.response.authenticatorData),signature:enc(c.response.signature),userHandle:c.response.userHandle?enc(c.response.userHandle):null},clientExtensionResults:c.getClientExtensionResults()};const f=await fetch('/gaon/admin/passkey/login/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor,credential})});if(!f.ok)throw Error('패스키 검증 실패 (HTTP '+f.status+')');const result=await f.json();if(!result.authenticated||!result.csrf_token)throw Error('세션 발급 응답이 올바르지 않습니다');csrf=result.csrf_token;el('login-state').textContent='✓ 관리자 로그인 성공 · 20분 세션 활성';el('login').textContent='다시 로그인';el('logout').disabled=false;el('approve').disabled=false;el('refresh').disabled=false;await loadStrategies();el('status').textContent='로그인 성공. 관리자 세션은 20분 후 만료됩니다. 아래 전략 승인 기능을 사용할 수 있습니다.';el('approve').scrollIntoView({behavior:'smooth',block:'center'})}catch(e){el('login-state').textContent='로그인 실패';el('status').textContent='로그인 실패: '+(e.name||'Error')+' / '+(e.message||'알 수 없는 오류')}};
el('logout').onclick=async()=>{const r=await fetch('/gaon/admin/passkey/logout',{method:'POST',headers:{'Content-Type':'application/json','X-Gaon-CSRF':csrf},body:'{}'});csrf='';el('login-state').textContent='로그아웃됨';el('logout').disabled=true;el('approve').disabled=true;el('refresh').disabled=true;el('status').textContent=r.ok?'로그아웃 완료':'로그아웃 요청 실패'};
let strategyFamilies=[];
function setOptions(element,items,placeholder){element.replaceChildren(new Option(placeholder,''));for(const item of items)element.add(new Option(item.label,item.value))}
function updateVersions(){const family=strategyFamilies.find(f=>f.family_id===el('family').value);const action=el('action').value;const valid=family?family.versions.filter(v=>action==='activate'?v.status==='apply_ready':v.status==='previous'):[];setOptions(el('version'),valid.map(v=>({value:v.id,label:v.label||v.id})),valid.length?'버전을 선택하세요':'선택 가능한 버전 없음')}
async function loadStrategies(){try{const r=await fetch('/gaon/admin/strategy/options',{cache:'no-store'});if(!r.ok)throw Error('목록 조회 실패 (HTTP '+r.status+')');const data=await r.json();strategyFamilies=data.families||[];const research=data.research_candidates||[];const target=el('research-list');target.replaceChildren();if(!research.length)target.textContent='연구 후보가 없습니다.';for(const x of research){const item=document.createElement('p');item.textContent='[검증 대기 · 승인 불가] '+x.source+' / '+x.id+' / '+x.state;target.append(item)}setOptions(el('family'),strategyFamilies.map(f=>({value:f.family_id,label:f.family_id})),'전략을 선택하세요');updateVersions();el('status').textContent='전략 목록 '+strategyFamilies.length+'개 불러옴'}catch(e){el('status').textContent=e.message}}
el('family').onchange=updateVersions;el('action').onchange=updateVersions;el('refresh').onclick=loadStrategies;
el('approve').onclick=async()=>{try{
if(!csrf)throw Error('먼저 로그인하세요');
const family_id=el('family').value.trim(),version_id=el('version').value.trim(),action=el('action').value;
if(!family_id||!version_id)throw Error('전략 패밀리와 버전 ID를 입력하세요');
if(!confirm(action+' / '+family_id+' / '+version_id+' 를 패스키로 승인하시겠습니까?'))return;
const headers={'Content-Type':'application/json','X-Gaon-CSRF':csrf};
const b=await fetch('/gaon/admin/strategy/approval/begin',{method:'POST',headers,body:JSON.stringify({action,family_id,version_id})});
if(!b.ok)throw Error('전략 승인 시작 거부');
const opts=await b.json();opts.challenge=dec(opts.challenge);for(const x of opts.allowCredentials||[])x.id=dec(x.id);
const c=await navigator.credentials.get({publicKey:opts});
const credential={id:c.id,rawId:enc(c.rawId),type:c.type,response:{clientDataJSON:enc(c.response.clientDataJSON),authenticatorData:enc(c.response.authenticatorData),signature:enc(c.response.signature),userHandle:c.response.userHandle?enc(c.response.userHandle):null},clientExtensionResults:c.getClientExtensionResults()};
const f=await fetch('/gaon/admin/strategy/approval/finish',{method:'POST',headers,body:JSON.stringify({action,family_id,version_id,credential})});
if(!f.ok)throw Error('전략 승인 검증 실패');
const r=await f.json();el('status').textContent='승인 결과: '+JSON.stringify(r);
}catch(e){el('status').textContent=e.message||'승인 실패'}};
</script></body></html>
