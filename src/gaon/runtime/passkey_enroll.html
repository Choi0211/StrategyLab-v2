<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가온 관리자 패스키 등록</title><style>body{font:16px system-ui;background:#10151e;color:#eef2f7;max-width:520px;margin:7vh auto;padding:20px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #536074}input{background:#1b2635;color:white}button{background:#638ff7;color:#07111f;font-weight:bold}small{color:#aab7ca}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><h1>가온 패스키 등록</h1><p>서버 관리자가 발급한 일회용 등록 토큰이 필요합니다.</p><label>관리자 식별자<input id="actor" autocomplete="username" value="owner"></label><label>일회용 승인 토큰<input id="token" type="password" autocomplete="off"></label><button id="enroll">휴대폰 패스키 등록</button><p><small>생체정보는 서버로 전송되지 않습니다. 이 화면은 HTTPS에서만 동작합니다.</small></p><pre id="status" role="status"></pre><script>
const status=document.getElementById('status');const enc=x=>{let s='';for(const b of new Uint8Array(x))s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};const dec=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
document.getElementById('enroll').onclick=async()=>{try{status.textContent='등록 요청 중...';const actor=document.getElementById('actor').value;const bootstrap_token=document.getElementById('token').value;const res=await fetch('/gaon/admin/passkey/enroll/begin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor,bootstrap_token})});document.getElementById('token').value='';if(!res.ok)throw Error('승인 토큰이 유효하지 않거나 만료되었습니다.');const options=await res.json();options.challenge=dec(options.challenge);options.user.id=dec(options.user.id);if(options.excludeCredentials)for(const c of options.excludeCredentials)c.id=dec(c.id);status.textContent='휴대폰에서 패스키를 승인해주세요.';const c=await navigator.credentials.create({publicKey:options});const credential={id:c.id,rawId:enc(c.rawId),type:c.type,response:{clientDataJSON:enc(c.response.clientDataJSON),attestationObject:enc(c.response.attestationObject)},clientExtensionResults:c.getClientExtensionResults()};const fin=await fetch('/gaon/admin/passkey/enroll/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor,credential})});if(!fin.ok)throw Error('패스키 검증에 실패했습니다. 새 승인 토큰으로 다시 시도해주세요.');status.textContent='패스키 등록이 완료되었습니다.'}catch(e){status.textContent=e.message||'등록 실패'}};</script></body></html>
