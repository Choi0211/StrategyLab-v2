[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategylab-v2"
version = "0.1.0"
description = "AI-assisted quantitative strategy research platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "StrategyLab" }]
dependencies = [
    "tzdata>=2024.1",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "Pillow>=10.0",
    "yt-dlp>=2025.1",
    "bgutil-ytdlp-pot-provider>=2.0.2,<3",
    "webauthn>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
