# Drop-in journald config capping total systemd-journal disk usage.
#
# Install as /etc/systemd/journald.conf.d/strategylab.conf (create the
# journald.conf.d directory if it doesn't exist), then:
#   systemctl restart systemd-journald
#
# Without a cap, journald's persistent log storage (/var/log/journal) grows
# unbounded as strategylab-gaon.service / gaon-web.service / the storage
# lifecycle timer all log routinely - this is the "systemd journal은 현재
# 500MB 제한 설정이 있으므로 유지 확인" requirement made into an actual,
# version-controlled artifact instead of an undocumented assumption about
# whatever is already on a given VPS.
[Journal]
SystemMaxUse=500M
